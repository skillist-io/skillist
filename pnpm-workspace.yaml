packages:
  - "apps/*"
  - "packages/*"

# Single source of truth for shared dependency versions across apps + packages.
# Reference as `"catalog:"` in each package.json so React-context singletons
# (router, query, auth) resolve to one instance. https://pnpm.io/catalogs
catalog:
  react: ^19.3.1
  react-dom: ^19.3.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@tanstack/react-router": ^1.170.46
  "@tanstack/react-query": ^5.106.1
  "@tanstack/react-query-persist-client": ^5.106.1
  "@tanstack/query-sync-storage-persister": ^5.106.1
  "@tanstack/router-plugin": ^1.168.48
  radix-ui: ^1.8.1
  lucide-react: ^1.69.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^3.7.0
  better-auth: ^1.7.18
  "@better-auth/mcp": 1.7.18
  "@better-auth/oauth-provider": 1.7.18
  "@better-auth/passkey": 1.7.18
  jose: ^6.2.3
  react-markdown: ^10.1.0
  remark-gfm: ^4.0.1
  zod: ^4.6.7
  typescript: ^7.0.2
  tailwindcss: ^4.3.4
  "@tailwindcss/vite": ^4.3.4
  "@tailwindcss/typography": ^0.5.20
  vite: ^8.3.6
  vitest: ^4.1.10
  "@vitejs/plugin-react": ^6.2.1
  "@cloudflare/ai-chat": 0.12.2
  "@cloudflare/workers-types": ^5.20261106.1
  "@fontsource-variable/inter": ^5.3.0
  "@radix-ui/react-dialog": ^1.3.1
  "@radix-ui/react-dropdown-menu": ^2.2.1
  "@radix-ui/react-label": ^2.1.17
  "@radix-ui/react-select": ^2.4.1
  "@radix-ui/react-slot": ^1.5.0
  "@radix-ui/react-tabs": ^1.2.1
  "@testing-library/react": ^16.3.3
  "@types/node": ^26.6.6
  agents: ^0.33.0
  ai: ^7.0.163
  drizzle-orm: ^0.45.4
  jsdom: ^29.1.1
  shadcn: ^4.23.0
  sharp: ^0.35.5
  tsx: ^4.23.15
  tw-animate-css: ^1.4.0
  wrangler: ^4.158.0
  yaml: ^2.9.1

onlyBuiltDependencies:
  - esbuild
  - lefthook
  - workerd
  - sharp

# core-js-pure ships a funding postinstall we don't need; skip it so pnpm
# doesn't error on the unapproved build script (pulled in via the AI SDK).
ignoredBuiltDependencies:
  - core-js-pure

# `pnpm add` refuses a version outside the catalog. This does NOT catch hand
# edits (`pnpm install` still accepts a hardcoded range), which is why
# scripts/check-catalog.mjs runs in CI as well.
catalogMode: strict

minimumReleaseAge: 0

allowBuilds:
  core-js-pure: false
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true
