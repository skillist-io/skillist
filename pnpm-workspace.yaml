packages:
  - "apps/*"
  - "packages/*"

# Single source of truth for shared dependency versions across apps + packages.
# Reference as `"catalog:"` in each package.json so React-context singletons
# (router, query, auth) resolve to one instance. https://pnpm.io/catalogs
catalog:
  react: ^19.2.7
  react-dom: ^19.2.7
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  "@tanstack/react-router": ^1.170.18
  "@tanstack/react-query": ^5.101.3
  "@tanstack/react-query-persist-client": ^5.101.3
  "@tanstack/query-sync-storage-persister": ^5.101.3
  "@tanstack/router-plugin": ^1.168.23
  radix-ui: ^1.6.4
  lucide-react: ^1.25.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^3.6.0
  better-auth: ^1.6.23
  "@better-auth/passkey": 1.6.23
  react-markdown: ^10.1.0
  remark-gfm: ^4.0.1
  zod: ^4.4.3
  typescript: ^7.0.2
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  "@tailwindcss/typography": ^0.5.20
  vite: ^8.1.5
  vitest: ^4.1.10
  "@vitejs/plugin-react": ^6.0.3
  "@cloudflare/ai-chat": 0.9.3
  "@cloudflare/workers-types": ^5.20260721.1
  "@fontsource-variable/inter": ^5.3.0
  "@radix-ui/react-dialog": ^1.1.20
  "@radix-ui/react-dropdown-menu": ^2.1.21
  "@radix-ui/react-label": ^2.1.12
  "@radix-ui/react-select": ^2.3.4
  "@radix-ui/react-slot": ^1.3.0
  "@radix-ui/react-tabs": ^1.1.18
  "@testing-library/react": ^16.3.2
  "@types/node": ^26.1.1
  agents: ^0.17.4
  ai: ^7.0.32
  drizzle-orm: ^0.45.2
  jsdom: ^29.1.1
  shadcn: ^4.13.1
  sharp: ^0.35.3
  tsx: ^4.20.3
  tw-animate-css: ^1.4.0
  wrangler: ^4.112.0
  yaml: ^2.9.0

onlyBuiltDependencies:
  - esbuild
  - lefthook
  - workerd
  - sharp

# core-js-pure ships a funding postinstall we don't need; skip it so pnpm
# doesn't error on the unapproved build script (pulled in via the AI SDK).
ignoredBuiltDependencies:
  - core-js-pure

# `pnpm add` refuses a version outside the catalog. This does NOT catch hand
# edits (`pnpm install` still accepts a hardcoded range), which is why
# scripts/check-catalog.mjs runs in CI as well.
catalogMode: strict

minimumReleaseAge: 0

allowBuilds:
  core-js-pure: false
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true
