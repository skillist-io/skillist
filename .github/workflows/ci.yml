name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `check` was one serial job: lint -> typecheck -> test -> build, 251s of
  # which only the longest leg is actually on the critical path. These three are
  # independent, so they now run concurrently and the gate takes as long as its
  # slowest member rather than their sum.
  # lint, typecheck, and build share one runner: they are fast and the split
  # cost a whole extra billable job (Actions rounds each job up to the minute)
  # for ~40s of wall clock. `test` stays separate because it is the long pole
  # and the only job needing a database.
  lint-build:
    runs-on: ubuntu-latest
    env:
      # Needed by the `wrangler deploy --dry-run` inside `pnpm build`.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm typecheck

      - run: pnpm build

      # `pnpm build` dry-runs the LOCAL wrangler.jsonc, so a typo, a missing
      # binding, or an invalid migration in the production config was only
      # discovered mid-deploy. Validate it in the gate instead.
      - run: pnpm --filter @skillist/api exec wrangler deploy --dry-run --config wrangler.production.jsonc

  test:
    runs-on: ubuntu-latest
    services:
      # Backs the DB-dependent suites. Without it they skip and the run still
      # goes green, which is exactly how org RBAC and account deletion went
      # untested for so long.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: skillist
          POSTGRES_PASSWORD: skillist
          POSTGRES_DB: skillist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Applies the schema (and pg_trgm) to the service container so the suite
      # runs against a real database instead of skipping.
      - run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://skillist:skillist@localhost:5432/skillist_test

      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgresql://skillist:skillist@localhost:5432/skillist_test

  smoke:
    needs: [lint-build, test, deploy-api, deploy-web, deploy-console, deploy-docs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm smoke
        env:
          SKILLIST_E2E_API_KEY: ${{ secrets.SKILLIST_E2E_API_KEY }}

      # e2e runs post-deploy against prod (skillist.io), not in the PR gate —
      # a PR can't be validated against a not-yet-deployed landing.
      - run: pnpm exec playwright install chromium --with-deps

      - run: pnpm test:e2e
        env:
          # Without this the `authenticated` Playwright project is not
          # registered at all (see tests/e2e/playwright.config.ts), so the run
          # goes green having exercised zero authenticated flows.
          E2E_AUTH_STATE_B64: ${{ secrets.E2E_AUTH_STATE_B64 }}

  deploy-api:
    needs: [lint-build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # NOT `pnpm build`: wrangler compiles the Worker from source at deploy
      # time, so building all nine workspaces here was ~66s of pure waste on the
      # critical path. skill-format is the one dependency that must be built,
      # because it resolves to dist/.
      - run: pnpm --filter @skillist/skill-format build

      - name: Deploy API
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy --config wrangler.production.jsonc

  deploy-web:
    needs: [lint-build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build @skillist/web's one built workspace dependency (skill-format
      # emits the .d.ts the web tsc build needs) before building web itself.
      - run: pnpm --filter @skillist/skill-format build && pnpm --filter @skillist/web build
        env:
          VITE_API_URL: https://api.skillist.io
          # Marketing container. Absent locally and in previews, so GTM only
          # loads on the deployed site.
          VITE_GTM_ID: ${{ secrets.VITE_GTM_ID_WEB }}

      - name: Deploy Web
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy

  deploy-console:
    needs: [lint-build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # skill-format emits the .d.ts the console tsc build needs.
      - run: pnpm --filter @skillist/skill-format build && pnpm --filter @skillist/console build
        env:
          VITE_API_URL: https://api.skillist.io
          # SEPARATE container from web: authenticated product usage must not be
          # mixed into the marketing property's acquisition reporting.
          VITE_GTM_ID: ${{ secrets.VITE_GTM_ID_CONSOLE }}

      - name: Deploy Console
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/console
          command: deploy

  deploy-docs:
    needs: [lint-build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @skillist/docs build
        env:
          # Astro requires the PUBLIC_ prefix to expose a var to the client.
          PUBLIC_GTM_ID: ${{ secrets.VITE_GTM_ID_WEB }}

      - name: Deploy Docs
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/docs
          command: deploy
