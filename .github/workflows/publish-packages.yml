name: Publish npm packages

on:
  workflow_dispatch:

concurrency:
  group: publish-packages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @skillist/skill-format build

      - name: Publish @skillist/skill-format
        run: |
          published=$(npm view @skillist/skill-format version 2>/dev/null || true)
          if [ "$published" = "0.1.0" ]; then
            echo "@skillist/skill-format@0.1.0 already on npm, skipping"
          else
            pnpm --filter @skillist/skill-format publish --no-git-checks --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: pnpm --filter @skillist/cli build

      - name: Publish @skillist/cli
        run: pnpm --filter @skillist/cli publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
