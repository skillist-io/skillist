name: Publish npm packages

on:
  workflow_dispatch:

concurrency:
  group: publish-packages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance: npm exchanges this OIDC token for a signed
      # attestation linking the tarball to this workflow and commit. Without it,
      # nothing ties what is on npm to what is in this repo — and these are
      # packages that agents install and execute.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Trusted publishing needs npm >= 11.5.1, and Node 22 bundles an older one.
      # No registry-url above: setup-node would write a token-based .npmrc, which
      # gets in the way of the OIDC exchange.
      - run: npm install -g npm@11

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @skillist/skill-format build

      - name: Publish @skillist/skill-format
        run: |
          published=$(npm view @skillist/skill-format version 2>/dev/null || true)
          pkg_version=$(node -p "require('./packages/skill-format/package.json').version")
          if [ "$published" = "$pkg_version" ]; then
            echo "@skillist/skill-format@$pkg_version already on npm, skipping"
          else
            # pnpm pack turns workspace:* into real versions, npm does the publish.
            pnpm --filter @skillist/skill-format pack --pack-destination "$RUNNER_TEMP"
            npm publish "$RUNNER_TEMP/skillist-skill-format-$pkg_version.tgz" --access public
          fi

      - run: pnpm --filter @skillist/cli build

      - name: Publish @skillist/cli
        run: |
          published=$(npm view @skillist/cli version 2>/dev/null || true)
          pkg_version=$(node -p "require('./packages/cli/package.json').version")
          if [ "$published" = "$pkg_version" ]; then
            echo "@skillist/cli@$pkg_version already on npm, skipping"
          else
            # pnpm pack turns workspace:* into real versions, npm does the publish.
            pnpm --filter @skillist/cli pack --pack-destination "$RUNNER_TEMP"
            npm publish "$RUNNER_TEMP/skillist-cli-$pkg_version.tgz" --access public
          fi

      # Depends on skill-format, so it publishes after it. A brand-new npm name
      # has no trusted publisher yet: the first release must be published by
      # hand and the publisher configured on npmjs.com before this step works.
      - run: pnpm --filter @skillist/agents build

      - name: Publish @skillist/agents
        run: |
          published=$(npm view @skillist/agents version 2>/dev/null || true)
          pkg_version=$(node -p "require('./packages/agents/package.json').version")
          if [ "$published" = "$pkg_version" ]; then
            echo "@skillist/agents@$pkg_version already on npm, skipping"
          else
            # pnpm pack turns workspace:* and catalog: into real versions, npm does the publish.
            pnpm --filter @skillist/agents pack --pack-destination "$RUNNER_TEMP"
            npm publish "$RUNNER_TEMP/skillist-agents-$pkg_version.tgz" --access public
          fi
