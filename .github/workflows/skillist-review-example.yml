name: skillist-review-example
on:
  workflow_dispatch:
    inputs:
      path:
        description: Skill directory
        required: true
        default: examples/skills/roll-dice
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/skillist-review
        with:
          path: ${{ inputs.path }}
          threshold: "60"
          fail-on: high
