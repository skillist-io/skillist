name: Skillist Review
description: Run skillist review with quality threshold and security fail-on gates
inputs:
  path:
    description: Path to skill directory containing SKILL.md
    required: true
  threshold:
    description: Minimum quality score (0-100). Empty skips score gate.
    required: false
    default: "80"
  fail-on:
    description: Fail when security findings meet this severity (low|medium|high|critical)
    required: false
    default: "high"
  api-url:
    description: Skillist API URL (optional, for org rubric fetch)
    required: false
  api-key:
    description: Skillist API key (optional)
    required: false
  org:
    description: Org slug for review rubric (optional)
    required: false
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Install Skillist CLI
      shell: bash
      run: npm install -g @skillist/cli
    - name: Review skill
      shell: bash
      env:
        SKILLIST_API_URL: ${{ inputs.api-url }}
        SKILLIST_API_KEY: ${{ inputs.api-key }}
      run: |
        set -euo pipefail
        ARGS=("${{ inputs.path }}" --json)
        if [ -n "${{ inputs.threshold }}" ]; then
          ARGS+=(--threshold "${{ inputs.threshold }}")
        fi
        if [ -n "${{ inputs.fail-on }}" ]; then
          ARGS+=(--fail-on "${{ inputs.fail-on }}")
        fi
        if [ -n "${{ inputs.org }}" ]; then
          ARGS+=(--org "${{ inputs.org }}")
        fi
        skillist review "${ARGS[@]}"
