<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skillist — Agent Skills Platform</title>
    <meta
      name="description"
      content="Skillist is a realtime registry and control plane for Agent Skills. Publish, version, govern, and deliver SKILL.md bundles with sub-10ms edge fan-out, compliant with the agentskills.io spec."
    />
    <!--
      No canonical or og:url here. This shell is served for EVERY route
      (landing, /registry, /{org}/{repo}), so a hardcoded homepage canonical
      told crawlers that every skill page was a duplicate of "/" — which
      de-indexes the registry. Per-route canonical/og:url are injected
      server-side in src/worker.ts.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Skillist" />
    <meta property="og:title" content="Skillist — Agent Skills Platform" />
    <meta
      property="og:description"
      content="Realtime registry and control plane for Agent Skills. Publish, version, govern, and deliver SKILL.md bundles with sub-10ms edge fan-out."
    />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Skillist — Agent Skills Platform" />
    <meta
      name="twitter:description"
      content="Realtime registry and control plane for Agent Skills. Publish, version, govern, and deliver SKILL.md bundles with sub-10ms edge fan-out."
    />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (() => {
        var m = document.cookie.match(/(?:^|;\s*)skillist-theme=([^;]*)/);
        var stored = m ? decodeURIComponent(m[1]) : null;
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        // Dark by default; "light" opts out, "system" follows the OS.
        var dark =
          stored === "light" ? false : stored === "system" ? prefersDark : true;
        if (dark) document.documentElement.classList.add("dark");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
