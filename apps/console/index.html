<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skillist Console</title>
    <meta name="description" content="Authenticated control plane for Skillist." />

    <!--
      The console is an authenticated product surface: it must never be
      indexed, and it must not claim marketing metadata. (This file was
      previously a verbatim copy of apps/web/index.html, canonical tag
      included, which pointed console.skillist.io at skillist.io.)
      Backed by public/robots.txt, since robots meta only applies to pages
      a crawler actually fetches.
    -->
    <meta name="robots" content="noindex, nofollow" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (() => {
        var m = document.cookie.match(/(?:^|;\s*)skillist-theme=([^;]*)/);
        var stored = m ? decodeURIComponent(m[1]) : null;
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        // Dark by default; "light" opts out, "system" follows the OS.
        var dark =
          stored === "light" ? false : stored === "system" ? prefersDark : true;
        if (dark) document.documentElement.classList.add("dark");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
